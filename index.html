<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModRock — KerimMC'nin Minecraft Bedrock Mod Arşivi</title>
  <meta name="description" content="KerimMC'nin modları artık ModRock'ta: modrocktr.com">

  <!--
    Bu site TAŞINDI: KerimMC'nin modları artık https://modrocktr.com adresinde.

    Üç katmanlı yönlendirme:
      1. canonical  → Google'a "asıl adres modrocktr.com" der
      2. meta refresh (0 sn) → Google bunu KALICI yönlendirme sayar
      3. JavaScript → tarayıcıyı anında geçirir
    Hiçbiri çalışmazsa sayfadaki bağlantı elle geçiş sağlar.

    noindex BİLEREK YOK: olsaydı Google bu sayfayı sadece silerdi; bu
    haliyle sayfanın arama sonuçlarındaki yerini modrocktr.com'a devreder.

    Eski sitenin tam hali: eski-site-yedek/index.html (bilgisayarda).
  -->
  <link rel="canonical" href="https://modrocktr.com/">
  <meta http-equiv="refresh" content="0; url=https://modrocktr.com/">
  <script>location.replace("https://modrocktr.com/");</script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0b0f;
      color: #f4f6fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 12px;
      background: #00e5c7;
      color: #0a0b0f;
      font-weight: 700;
      text-decoration: none;
    }
    p { color: #98a0b3; }
  </style>
</head>
<body>
  <main>
    <h1>Modlar taşındı</h1>
    <p>KerimMC'nin bütün modları artık ModRock'ta.</p>
    <a href="https://modrocktr.com/">modrocktr.com'a git</a>
  </main>
</body>
</html>
